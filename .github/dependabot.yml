# Monthly, grouped per ecosystem, so updates arrive as one pull request each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: monthly }
    groups: { backend: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    groups: { frontend: { patterns: ["*"] } }
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: monthly }
    groups: { android: { patterns: ["*"] } }
  - package-ecosystem: swift
    directory: /ios/Core
    schedule: { interval: monthly }
    groups: { ios: { patterns: ["*"] } }
  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: monthly }
    groups: { images: { patterns: ["*"] } }
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: monthly }
    groups: { images: { patterns: ["*"] } }
    # Python and Node move on purpose, together with pyproject.toml, CI and the docs.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]

# Production: use the images built by CI instead of building on the server. COMPASS_REGISTRY in
# .env is where CI pushes them: ghcr.io/<GitHub user or organisation, lowercase>.
services:
  api:
    image: ${COMPASS_REGISTRY:?COMPASS_REGISTRY missing in .env}/compass-api:${COMPASS_VERSION:-latest}
  worker:
    image: ${COMPASS_REGISTRY:?COMPASS_REGISTRY missing in .env}/compass-api:${COMPASS_VERSION:-latest}
  mcp:
    image: ${COMPASS_REGISTRY:?COMPASS_REGISTRY missing in .env}/compass-api:${COMPASS_VERSION:-latest}
  caddy:
    image: ${COMPASS_REGISTRY:?COMPASS_REGISTRY missing in .env}/compass-web:${COMPASS_VERSION:-latest}
    # No extra ports: Caddy stays on COMPASS_HTTP_PORT (localhost). A reverse proxy in front
    # terminates TLS and forwards the Compass hostname there (see docs/deploy.md).

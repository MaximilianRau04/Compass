[project]
name = "compass-backend"
version = "0.1.0"
description = "Compass: API, MCP server and worker"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "apscheduler>=3.10,<4",
    "bcrypt>=5.0.0",
    "fastapi>=0.143.3",
    "icalendar>=6",
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-dateutil>=2.9.0.post0",
    "recurring-ical-events>=3",
    "sqlalchemy>=2",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-python-dateutil>=2.9.0.20260807",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# generated by Alembic
"migrations/versions/*" = ["UP", "F401", "I001", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
